name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version

      - name: List project schemes
        run: |
          xcodebuild -project SoundCloudPlayer.xcodeproj -list

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project SoundCloudPlayer.xcodeproj \
            -scheme SoundCloudPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER=com.yukovalevb2016.playr \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA for AltStore
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/SoundCloudPlayer.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/SoundCloudPlayer.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$RUNNER_TEMP/SoundCloudPlayer-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloudPlayer-unsigned-IPA
          path: ${{ runner.temp }}/SoundCloudPlayer-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
